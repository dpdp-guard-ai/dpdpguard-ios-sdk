openapi: 3.1.0
info:
  title: DPDP Guard — Consent Manager API
  version: 2.23.1
  description: |
    The versioned, hand-authored contract for DPDP Guard's HTTP API — the
    source of truth for the wire shape of every endpoint below.

    **Scope note:** this covers the `/cm/v1/consent` "Consent Manager API"
    slice plus the fuller `/api/v1` mobile/server SDK surface
    (org/notice/banner-config reads, the token broker, anonymous consent +
    linking, DSR, grievance, and nomination endpoints) plus the
    `/api/v1/staff/*` fiduciary/DPO dashboard surface, a scope expansion
    beyond the original Consent Manager API. New endpoints are added here
    as they ship.

    **Out of scope, by design:** two other routes exist on this API but are
    deliberately not modeled here, since neither is part of the JSON wire
    contract this file documents:
    - `POST /api/webhooks/scanner-result` — an internal webhook used by
      DPDP Guard's own domain scanner, authenticated with a shared secret
      (never an org API key or a brokered principal token). Not a surface
      any SDK or third party calls.
    - `GET /embed/v1/policy/{token}` — serves rendered HTML (`text/html`,
      with a `Content-Security-Policy` header) for the hosted Privacy
      Policy iframe embed, not JSON.

    **Error catalog:** `/api/v1` responses use `ApiError` (`code` + `error`),
    a stable, machine-readable error catalog. The older `/cm/v1/consent`
    slice still returns the free-text-only `Error` shape documented below —
    introducing a `code` there is a tracked breaking-change follow-up.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: https://{deployment}.convex.site
    description: Convex HTTP Actions endpoint for a given deployment.
    variables:
      deployment:
        default: your-deployment-name
        description: The deployment slug DPDP Guard provisioned for your organization.
security:
  - apiKey: []
paths:
  /cm/v1/consent:
    post:
      operationId: recordConsent
      summary: Record a new consent on behalf of a known data principal.
      description: |
        Blocks tracking/marketing/
        targeting purposes for verified minors when the organization has
        `disableTrackingForMinors` set (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsentRequest"
      responses:
        "201":
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "400":
          description: >
            Missing/invalid required fields, malformed JSON body, or the
            notice is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Tracking consent blocked for a verified minor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Notice not found (or belongs to a different organization), or no
            data principal matches the given email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The data principal already has an active consent for this notice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cm/v1/consent/{consentId}:
    get:
      operationId: getConsent
      summary: Fetch a consent record by id.
      parameters:
        - $ref: "#/components/parameters/ConsentId"
      responses:
        "200":
          description: The consent record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "400":
          description: The consent id is not a valid identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such consent record, or it belongs to a different
            organization than the API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: withdrawConsent
      summary: Withdraw a consent record.
      description: >
        Withdrawal is deliberately as easy as giving consent: no request
        body, one call, mirrors the DPDP requirement.
      parameters:
        - $ref: "#/components/parameters/ConsentId"
      responses:
        "200":
          description: The now-withdrawn consent record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "400":
          description: The consent id is not a valid identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such consent record, or it belongs to a different
            organization than the API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The consent is already withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/org/{slug}:
    get:
      operationId: getOrgBySlug
      summary: Resolve an organization by slug (public).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "404":
          description: No organization matches this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/org/{orgId}/notices:
    get:
      operationId: getNoticesForOrg
      summary: List published notices for an organization (public, multilingual).
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Published notices.
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notice"
        "400":
          description: orgId is not a valid identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/notices/{noticeId}:
    get:
      operationId: getNoticeById
      summary: Fetch a single notice by id (public).
      security: []
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The notice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
        "404":
          description: No such notice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/org/{orgId}/banner-config:
    get:
      operationId: getBannerConfig
      summary: Resolve banner config for a web domain, native app, or org-default (public).
      description: >
        Pass `?domain=` for the web scope, `?appId=` for the native-app
        scope, or neither for org-default. Response `configVersion` is a
        presentation-config version, distinct from `notice.version` — a
        cosmetic edit bumps it without ever triggering re-consent.
      security: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: domain
          in: query
          schema:
            type: string
        - name: appId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resolved banner config.
          content:
            application/json:
              schema:
                type: object
                required: [configVersion]
                properties:
                  bannerSettings:
                    type: object
                  configVersion:
                    type: integer
        "404":
          description: >
            The domain is not registered to this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/widget/config:
    get:
      operationId: getWidgetConfig
      summary: >
        Resolve org, notice, and banner styling for the no-React embeddable
        widget script in one round trip (public).
      description: >
        Powers the no-React
        embeddable widget script's single config call: given the
        domain-group id its script tag was generated with (`?id=`) and the
        embedding page's hostname (`?domain=`), resolves the organization,
        the notice that applies to that domain group (its own if
        published, else the org's default), and the domain group's banner
        styling. Strict domain check: a
        `domainGroupId` whose organization has no matching registered
        `domains` row for the given hostname resolves to 404, mirroring the
        same trust boundary as fetching a published notice.
      security: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Convex document id of the `domainGroups` row (the widget script's `?id=`).
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved widget config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"
        "400":
          description: Missing `id`/`domain` query params, or `id` is not a valid identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            No matching domain group, the domain isn't registered to that
            group's organization, or no notice resolves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/broker-token:
    post:
      operationId: brokerToken
      summary: Mint a short-lived principal access token.
      description: >
        Authenticated with a **service API key** (never a principal
        credential). No refresh token is issued — the mobile app re-brokers
        via its own backend once the returned token expires.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId]
              properties:
                externalId:
                  type: string
                  description: The fiduciary's own stable user id, org-scoped.
      responses:
        "201":
          description: Access token minted.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt, tokenType]
                properties:
                  accessToken:
                    type: string
                  expiresAt:
                    type: integer
                  tokenType:
                    type: string
                    enum: [Bearer]
        "400":
          description: Missing externalId or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid service API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/cm/signal:
    post:
      operationId: receiveCmSignal
      summary: >
        Government CM API Bridge — receive an inbound consent signal from a
        registered third-party Consent Manager.
      description: >
        Authenticated
        with the same org-scoped API key as `/cm/v1/consent` (never a
        brokered principal token) — the reverse direction of that flow:
        here a third-party Consent Manager pushes a signal on behalf of one
        of its Data Principals, rather than the fiduciary recording its own
        consent. MeitY's registered-CM interoperability spec isn't published
        yet, so every signal lands `mappingStatus: "unresolved"` unless it
        exactly repeats a signal already recorded, in which case it lands
        `"duplicate"` — CM webhooks are expected to retry, so a repeat
        delivery still returns 201 rather than erroring.

        **Known gap:** unlike every other `/api/v1` endpoint, this route's
        error responses use the free-text-only `Error` shape, not
        `ApiError` — it predates this API's error-catalog rollout to
        `/api/v1` and hasn't been migrated yet. Treat this as a documented
        inconsistency, not a schema-design choice to imitate for new
        endpoints.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cmRegistryId
                - cmName
                - principalTokenFromCm
                - purposes
                - signalType
              properties:
                cmRegistryId:
                  type: string
                  description: The sending Consent Manager's registry id under MeitY's framework.
                cmName:
                  type: string
                principalTokenFromCm:
                  type: string
                  description: >
                    The CM's own opaque identifier for the Data Principal.
                    Not yet mapped to a local `userProfile` — see the
                    description above.
                purposes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                signalType:
                  type: string
                  enum: [consent_given, consent_withdrawn, consent_updated]
      responses:
        "201":
          description: Signal recorded (or matched an existing duplicate delivery).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmSignalRecord"
        "400":
          description: Missing/invalid fields, or the JSON body is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/link-anonymous-consent:
    post:
      operationId: linkAnonymousConsent
      summary: Reconcile a guest's anonymous consent trail into the now-known principal.
      description: >
        Authenticated with a brokered principal access token. Idempotent:
        re-linking the same anonymousId never double-materializes a
        profile-bound row.
      security:
        - principalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymousId]
              properties:
                anonymousId:
                  type: string
      responses:
        "200":
          description: Reconciliation result.
          content:
            application/json:
              schema:
                type: object
                required: [linkedCount, needsReconsent]
                properties:
                  linkedCount:
                    type: integer
                  needsReconsent:
                    type: array
                    items:
                      type: object
                      required: [noticeId, purpose, dataTypes]
                      properties:
                        noticeId:
                          type: string
                        purpose:
                          type: string
                        dataTypes:
                          type: array
                          items:
                            type: string
        "400":
          description: Missing anonymousId or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consents/anonymous:
    post:
      operationId: giveConsentAnonymous
      summary: Record consent for a not-yet-authenticated guest.
      description: >
        Unauthenticated public write, keyed by a client-generated
        `anonymousId`. Rate-limited. Accepts an `Idempotency-Key` header —
        a retried request after a network timeout returns the original
        response instead of double-writing the consent event.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, noticeId, purpose, dataTypes, anonymousId]
              properties:
                organizationId:
                  type: string
                noticeId:
                  type: string
                purpose:
                  type: string
                  minLength: 1
                dataTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                anonymousId:
                  type: string
                  minLength: 1
                noticeLocale:
                  type: string
                  maxLength: 16
                  description: Locale of the notice text the visitor read.
                noticeHash:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: >
                    SHA-256 of the exact notice text presented, stored in the
                    consent audit trail as evidence of what was shown.
                domainGroupId:
                  type: string
                  description: >
                    The domain group the embedded widget loaded for. Used to
                    attribute the consent when the notice itself is org-wide
                    (not scoped to a group); ignored when the notice is scoped,
                    and dropped if it is not a group in this organization.
      responses:
        "201":
          description: Consent recorded.
          content:
            application/json:
              schema:
                type: object
                required: [consentId, purpose, dataTypes, givenAt]
                properties:
                  consentId:
                    type: string
                  purpose:
                    type: string
                  dataTypes:
                    type: array
                    items:
                      type: string
                  givenAt:
                    type: integer
        "400":
          description: >
            Missing/invalid fields, rate limited, notice not published, or
            already consented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consents/anonymous/withdraw:
    post:
      operationId: withdrawConsentAnonymous
      summary: Withdraw a guest's consent for one or more purposes.
      description: >
        Unauthenticated public write, authorised by possession of the
        client-generated `anonymousId` that recorded the consent. Rate-limited.
        Idempotent: purposes with no active consent are not counted. Notifies
        connected processors, as an authenticated withdrawal does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, anonymousId, purposes]
              properties:
                organizationId:
                  type: string
                anonymousId:
                  type: string
                  minLength: 1
                purposes:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    minLength: 1
      responses:
        "200":
          description: Withdrawal processed.
          content:
            application/json:
              schema:
                type: object
                required: [withdrawn, purposes, withdrawnAt]
                properties:
                  withdrawn:
                    type: integer
                  purposes:
                    type: array
                    items:
                      type: string
                  withdrawnAt:
                    type: integer
        "400":
          description: Missing/invalid fields or rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consents/{consentId}/withdrawal-acknowledgement:
    post:
      operationId: acknowledgeConsentWithdrawal
      summary: >
        Report that a connected processor acted on a `consent.withdrawn`
        notification (research/2026-08-30-dpdp-research.md, §5-P1).
      description: >
        `processorNotificationLogs` (see `convex/webhooks.ts`) only ever
        records whether the outbound `consent.withdrawn` webhook delivery
        reached the processor, never whether the processor actually stopped
        processing. A connected processor calls this endpoint to report what
        it did, closing the loop the same way
        `/api/v1/dsr/{requestId}/processor-confirmation` does for erasure
        requests.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ConsentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [processorName, outcome]
              properties:
                processorName:
                  type: string
                  minLength: 1
                outcome:
                  type: string
                  enum: [completed, partial, failed]
                note:
                  type: string
      responses:
        "201":
          description: Acknowledgement recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: >
            Missing/invalid fields, invalid consent id, or the consent has
            not been withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The consent does not belong to the calling key's
            organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/dsr:
    post:
      operationId: createDsrRequest
      summary: File a Data Subject Request.
      description: >
        Authenticated with a brokered principal access token, not a staff
        login. Requires the caller's principal to belong to the
        organization (own org, or a prior consent link). Accepts an
        `Idempotency-Key` header.
      security:
        - principalToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, type]
              properties:
                organizationId:
                  type: string
                type:
                  type: string
                  enum: [summary, processors, correction, erasure]
                details:
                  type: string
      responses:
        "201":
          description: Request filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsrRequest"
        "400":
          description: >
            Missing/invalid fields, invalid type, or the principal isn't
            associated with the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listDsrRequestsForCurrentUser
      summary: List the caller's own DSR requests, with SLA `dueAt`.
      security:
        - principalToken: []
      responses:
        "200":
          description: The caller's own requests.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/DsrRequest"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/grievances:
    post:
      operationId: createGrievance
      summary: File a grievance.
      description: >
        Authenticated with a brokered principal access token. Requires the
        caller's principal to belong to the organization (own org, or a
        prior consent link). Accepts an `Idempotency-Key` header.
      security:
        - principalToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, subject, description]
              properties:
                organizationId:
                  type: string
                subject:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Grievance filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grievance"
        "400":
          description: >
            Missing/invalid fields, or the principal isn't associated with
            the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listGrievancesForCurrentUser
      summary: List the caller's own grievances, with SLA `dueAt`.
      security:
        - principalToken: []
      responses:
        "200":
          description: The caller's own grievances.
          content:
            application/json:
              schema:
                type: object
                required: [grievances]
                properties:
                  grievances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grievance"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/nomination:
    get:
      operationId: getNomination
      summary: Fetch the caller's current successor nomination, or null.
      security:
        - principalToken: []
      responses:
        "200":
          description: The active nomination, or null if none is set.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Nomination"
                  - type: "null"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: upsertNomination
      summary: Set or replace the caller's successor nomination.
      description: >
        Idempotent in effect: re-calling with new details updates the same
        active nomination row rather than creating a second one.
      security:
        - principalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomineeName, nomineeContact]
              properties:
                nomineeName:
                  type: string
                  minLength: 1
                nomineeContact:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: The upserted nomination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nomination"
        "400":
          description: Missing/invalid fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: revokeNomination
      summary: Revoke the caller's successor nomination.
      description: >
        Withdrawal-parity with consent: revoking is one call, same friction
        as setting a nomination. A no-op (still 200) if none was active.
      security:
        - principalToken: []
      responses:
        "200":
          description: Revoked (or already had none active).
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/age/verify-parent:
    post:
      operationId: verifyParent
      summary: Verify parental consent via an authorized-entity opaque token.
      description: >
        Verifies via a DigiLocker/authorized-entity opaque token. Only the
        opaque token is transmitted; no raw ID document leaves the device.
        There is no `childUserId` parameter — the brokered principal *is*
        the profile being verified.
      security:
        - principalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokenFromProvider]
              properties:
                tokenFromProvider:
                  type: string
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "400":
          description: Missing/invalid token, or the provider rejected it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/retention/due:
    get:
      operationId: listDueRetentions
      summary: >
        List the organization's data principals past their retention
        window (docs/specs/crm-backend-integration-blockers.md, B1).
      description: >
        Read-only: returns active (not yet cancelled/executed)
        `scheduledErasures` rows whose window has already elapsed, so a
        fiduciary's server integration can trigger its own erasure
        automation instead of a human watching the dpdpbot dashboard.
        Write access to
        retention policies and scheduled erasures stays dashboard-only
        (ADR-007 D3) — there is no corresponding write route.
      security:
        - apiKey: []
      responses:
        "200":
          description: The calling key's organization's due retentions.
          content:
            application/json:
              schema:
                type: object
                required: [due]
                properties:
                  due:
                    type: array
                    items:
                      type: object
                      required: [scheduledErasureId, userId, scheduledFor, reason]
                      properties:
                        scheduledErasureId:
                          type: string
                        userId:
                          type: string
                        scheduledFor:
                          type: number
                          description: Epoch ms the retention window elapsed.
                        reason:
                          type: string
                        preNotificationSentAt:
                          type: number
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consent-status:
    get:
      operationId: getConsentStatus
      summary: >
        Look up an org's per-purpose consent state by email
        (docs/specs/ecommerce-cms-plugins.md, §4).
      description: >
        Read-only: a WooCommerce/Shopify plugin's only fact about a customer
        is an email address from its own storefront — every other
        consent-reading route requires a dpdpbot-internal consent id or a
        brokered principal token. This resolves an email to the calling
        organization's own current per-purpose consent grants, so a plugin
        can gate a marketing sync in real time. `found: false` (not a 404)
        means the identifier is not yet a customer of record for this
        organization — distinct from "known, with no active consent", which
        is `found: true` and an empty or all-opted-out `purposes` array.
        Write access to
        consent stays `POST`/`DELETE /cm/v1/consent` — there is no
        corresponding write route here (ADR-007 D3).
      security:
        - apiKey: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: The calling key's organization's consent status for this email.
          content:
            application/json:
              schema:
                type: object
                required: [identifier, identifierType, found, purposes]
                properties:
                  identifier:
                    type: string
                  identifierType:
                    type: string
                    enum: [email]
                  found:
                    type: boolean
                  purposes:
                    type: array
                    items:
                      type: object
                      required: [purposeKey, category, status]
                      properties:
                        purposeKey:
                          type: string
                        category:
                          type: string
                          enum: [essential, non_essential]
                        status:
                          type: string
                          enum: [opt_in, opt_out]
                        withdrawnAt:
                          type: number
                          description: Epoch ms this purpose was withdrawn, if any.
                        standardPurpose:
                          type: string
                          enum:
                            - dpdp_reserved.marketing
                            - dpdp_reserved.transactional
                            - dpdp_reserved.analytics
                          description: >
                            The reserved, platform-defined purpose this org's
                            own `purposeKey` maps to
                            (docs/specs/ecommerce-cms-plugins.md, §6), when a
                            DPO has set one — so a plugin written once against
                            e.g. `dpdp_reserved.marketing` works across every
                            dpdpbot organization instead of string-matching a
                            per-org label. Omitted when no mapping exists.
        "400":
          description: Missing `email` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/dsr/{requestId}/processor-confirmation:
    post:
      operationId: recordDsrProcessorConfirmation
      summary: >
        Report what a connected processor actually did about an erasure
        request (docs/specs/ecommerce-cms-plugins.md, §7).
      description: >
        `dsr.completed` (§2) tells a plugin an erasure was approved on
        dpdpbot's side; store-side erasure is rarely total deletion (an order
        record may be anonymized rather than deleted for tax/accounting
        retention, or a downstream API call may fail). This is the inbound
        record of what each connected system actually did, surfaced on the
        DSR detail view so a DPO auditing an erasure can see more than
        "dpdpbot marked this complete". Additive and read-mostly from
        dpdpbot's perspective — it does not reopen or alter the DSR's own
        status.
      security:
        - apiKey: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [processorName, outcome, details]
              properties:
                processorName:
                  type: string
                outcome:
                  type: string
                  enum: [completed, partial, failed]
                details:
                  type: array
                  items:
                    type: object
                    required: [system, action]
                    properties:
                      system:
                        type: string
                      action:
                        type: string
                      note:
                        type: string
      responses:
        "201":
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: >
            Malformed request body, or the request id does not identify an
            erasure request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The request id does not belong to the calling key's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/withdrawals/{propagationId}/ack:
    post:
      operationId: acknowledgeWithdrawalPropagation
      summary: >
        Confirm that a consent withdrawal took effect at this destination
        (research/2026-08-30-dpdp-research.md, §5-P1).
      description: >
        The public half of the withdrawal-propagation acknowledgement
        ledger: `suppressionList` proves a withdrawal was *registered*, and
        this closes the loop the same way
        `/api/v1/dsr/{requestId}/processor-confirmation` does for erasure
        requests — a downstream destination reports for itself that it
        actually stopped processing, rather than a DPO taking dpdpbot's word
        for it. Idempotent: acknowledging an already-acknowledged row
        succeeds without changing its `acknowledgedAt`, because a retried
        confirmation must never fail.
      security:
        - apiKey: []
      parameters:
        - name: propagationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged (or already was).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The propagation id does not belong to the calling key's
            organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/withdrawals/{suppressionId}/propagations:
    get:
      operationId: getWithdrawalPropagationStatus
      summary: >
        Poll "N of M systems confirmed" for a withdrawal
        (research/2026-08-30-dpdp-research.md, §5-P1, §6.2).
      description: >
        The read-side counterpart to
        `/api/v1/consents/{consentId}/withdrawal-acknowledgement`: lets a
        connected plugin poll how many downstream destinations have
        confirmed a withdrawal it caused, the same way
        `/api/v1/suppression-list` lets it poll the suppression list itself,
        rather than requiring a DPO to check the console.
      security:
        - apiKey: []
      parameters:
        - name: suppressionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The suppression's fan-out status across destinations.
          content:
            application/json:
              schema:
                type: object
                required: [total, acknowledged, failed, entries]
                properties:
                  total:
                    type: number
                  acknowledged:
                    type: number
                  failed:
                    type: number
                  entries:
                    type: array
                    items:
                      type: object
                      required: [destinationLabel, status, dispatchedAt]
                      properties:
                        destinationLabel:
                          type: string
                        status:
                          type: string
                          enum: [pending, acknowledged, overdue, failed]
                        dispatchedAt:
                          type: number
                        acknowledgedAt:
                          type: number
                        failedAt:
                          type: number
                        failureReason:
                          type: string
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The suppression entry does not belong to the calling
            key's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/suppression-list:
    get:
      operationId: listSuppressionList
      summary: >
        Incrementally pull identifiers to stop marketing to
        (docs/specs/ecommerce-cms-plugins.md, §5).
      description: >
        Read-only, cursor-by-`suppressedAt`: the reconciliation half of the
        webhook + poll pattern — a plugin's fallback sweep for when a
        `consent.withdrawn` webhook delivery failed, since delivery is
        at-least-once-attempted but not guaranteed. Populated whenever a
        withdrawing consent's principal has a known email; an
        anonymous/guest consent has nothing to suppress. Write access is
        withdrawal/erasure-triggered only — there is no manual write route.
      security:
        - apiKey: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: number
            default: 0
          description: >
            Epoch ms; only entries suppressed strictly after this are
            returned. Omit (or pass 0) to pull the full list.
      responses:
        "200":
          description: The calling key's organization's suppression-list entries after `since`.
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [identifier, identifierType, reason, suppressedAt]
                      properties:
                        identifier:
                          type: string
                        identifierType:
                          type: string
                          enum: [email, phone]
                        reason:
                          type: string
                          enum: [consent_withdrawal, dsr_erasure, manual]
                        suppressedAt:
                          type: number
                        liftedAt:
                          type: number
                  nextCursor:
                    type: [number, "null"]
                    description: >
                      Pass as the next call's `since` to continue the pull;
                      `null` means the response was not truncated.
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/breaches:
    get:
      operationId: listBreaches
      summary: >
        List the organization's breach register
        (docs/specs/crm-backend-integration-blockers.md, B1).
      description: >
        Read-only: returns the organization's breach register (s.8(6)), so a
        fiduciary's server integration can trigger its own containment-erasure
        automation off a reported breach instead of a human watching the
        dpdpbot dashboard. Simulated breaches from the Breach Drill Simulator
        are excluded. Write access to the breach register stays
        dashboard-only (ADR-007
        D3) — there is no corresponding write route.
      security:
        - apiKey: []
      responses:
        "200":
          description: The calling key's organization's breach register.
          content:
            application/json:
              schema:
                type: object
                required: [breaches]
                properties:
                  breaches:
                    type: array
                    items:
                      type: object
                      required: [breachId, description, discoveredAt, status]
                      properties:
                        breachId:
                          type: string
                        description:
                          type: string
                        discoveredAt:
                          type: number
                          description: Epoch ms the breach was discovered.
                        reportedToUserAt:
                          type: number
                        reportedToBoardAt:
                          type: number
                        detailedReportSubmittedAt:
                          type: number
                        certInReportSubmittedAt:
                          type: number
                        mitigation:
                          type: string
                        status:
                          type: string
                          enum:
                            - reported_user_pending
                            - reported_user_done
                            - reported_board_pending
                            - reported_board_done
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consent-portability/exports/{exportId}/manifest:
    get:
      operationId: getConsentPortabilityManifest
      summary: >
        Read a signed consent-portability export's manifest
        (research/2026-09-27-dpdp-research.md, Idea P0 "you can leave with
        your evidence").
      description: >
        The certificate, not the cargo: schema version, scope, record
        counters, the running SHA-256 digest folded over every exported
        record, and its platform HMAC signature — never the record payloads
        themselves (those stay on the in-console `pageExportRecords` query,
        unreachable from this surface). Lets a fiduciary's own server
        integration, or the receiving party on a change of Consent Manager
        (Indian Bank RFP GEM/2026/B/7823086 §1.6.1(e)), fetch a signed
        manifest without a human in a browser. Authenticated with the same
        org-scoped API key as `/api/v1/breaches`.
      security:
        - apiKey: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The export's signed manifest.
          content:
            application/json:
              schema:
                type: object
                required:
                  - exportId
                  - organizationId
                  - schemaVersion
                  - status
                  - reason
                  - scopeFromMs
                  - scopeToMs
                  - consentRecordCount
                properties:
                  exportId:
                    type: string
                  organizationId:
                    type: string
                  schemaVersion:
                    type: string
                  status:
                    type: string
                    enum: [pending, building, complete, failed]
                  reason:
                    type: string
                    enum:
                      - consent_manager_change
                      - solution_replacement
                      - regulatory_portability
                      - routine_drill
                  scopeFromMs:
                    type: number
                  scopeToMs:
                    type: number
                  consentRecordCount:
                    type: number
                  runningDigest:
                    type: string
                  manifestSignature:
                    type: string
                  manifestSignatureKeyId:
                    type: string
                  completedAt:
                    type: number
                  verificationRecipe:
                    type: string
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The export does not exist or belongs to a different organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consent/verify:
    post:
      operationId: verifyConsentGate
      summary: >
        Check whether a consent may still be acted on
        (research/2026-08-04-dpdp-research.md, Idea P3 "Consent Gate").
      description: |
        Read-only stop-processing enforcement: a fiduciary's backend calls
        this immediately before acting on a principal's data and gets back an
        allow/deny decision derived from the consent record's own
        `withdrawnAt` state, rather than trusting whatever consent state its
        own pipeline cached locally.

        Authenticated with the same org-scoped `apiKey` service credential as
        `/api/v1/breaches` and `/cm/v1/consent` (ADR-004 D2). A consent that
        belongs to another organization is reported as `404`, not `403`, so
        the endpoint cannot be used to probe for consent ids outside the
        calling key's org.

        Withdrawal itself stays `DELETE /cm/v1/consent/{consentId}`'s job —
        this route never mutates the consent record. It appends an
        immutable decision row to the org's Consent Gate audit log; that log
        is read from the dashboard, not from this API.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consentId]
              properties:
                consentId:
                  type: string
                  description: >
                    The consent record to evaluate. Must belong to the calling
                    key's organization.
      responses:
        "200":
          description: >
            The decision. `allow` means the consent is active; `deny` means it
            has been withdrawn and processing that depends on it must stop.
          content:
            application/json:
              schema:
                type: object
                required: [decision, reason, consentId]
                properties:
                  decision:
                    type: string
                    enum:
                      - allow
                      - deny
                  reason:
                    type: string
                    enum:
                      - consent_active
                      - consent_withdrawn
                  consentId:
                    type: string
        "400":
          description: >
            Missing or malformed JSON body, a missing `consentId`, or a
            `consentId` that isn't a well-formed id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            The consent does not exist or belongs to another organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consent/gate/decisions:
    get:
      operationId: listConsentGateDecisions
      summary: >
        Read the organization's Consent Gate decision audit log
        (research/2026-08-04-dpdp-research.md, Idea P3 "Consent Gate").
      description: |
        Read-only: returns the immutable allow/deny decisions recorded for
        the calling key's organization by `POST /api/v1/consent/verify`,
        newest first, so a fiduciary's SIEM or on-call tooling can ingest
        them instead of a human reading them off the dashboard.

        Authenticated with the same org-scoped `apiKey` service credential
        as `/api/v1/consent/verify` itself (ADR-004 D2) — an integration
        that already calls the gate needs no new credential to read back
        what it was told. The log is append-only: `verifyForApiKey` is the
        only writer and there is no corresponding write route (ADR-007 D3).

        Returns an empty `decisions` array rather than an error when nothing
        has been recorded.
      security:
        - apiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            How many decisions to return, newest first. Defaults to 50 and
            is clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: >
            The calling key's organization's recorded Consent Gate
            decisions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentGateDecision"
        "400":
          description: A `limit` that isn't a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/consent/gate/alerts:
    get:
      operationId: listConsentGateBypassAlerts
      summary: >
        Read the organization's Consent Gate bypass alerts
        (research/2026-08-04-dpdp-research.md, Idea P3 "Consent Gate").
      description: |
        Read-only: returns the consents that look like a bypass attempt —
        one that has been denied `denyThreshold` or more times inside the
        rolling `windowMs` window. A single deny is the gate working as
        intended; a cluster of denies against the same consent is an
        integration that keeps asking, or keeps acting regardless of the
        answer, instead of respecting the first "stop".

        `windowMs` and `denyThreshold` are echoed back on every response,
        including an empty one, so a caller can tell what "no alerts" was
        measured against instead of hard-coding the heuristic's constants.

        Authenticated with the same org-scoped `apiKey` service credential
        as `/api/v1/consent/verify` (ADR-004 D2). Derived entirely from the
        decision log — it stores nothing of its own and mutates nothing.

        Returns an empty `alerts` array (with `windowMs`/`denyThreshold`
        still populated) rather than an error when no bypass pattern is
        detected.
      security:
        - apiKey: []
      responses:
        "200":
          description: >
            The calling key's organization's candidate bypass attempts, most
            recently denied first.
          content:
            application/json:
              schema:
                type: object
                required: [alerts, windowMs, denyThreshold]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentGateBypassAlert"
                  windowMs:
                    type: integer
                    description: >
                      The rolling window, in milliseconds, a deny still
                      counts toward an alert within.
                  denyThreshold:
                    type: integer
                    description: >
                      In-window denies against one consent that constitute an
                      alert.
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/cross-border/transfers:
    get:
      operationId: listCrossBorderTransfers
      summary: >
        List the organization's cross-border transfer register
        (docs/specs/crm-backend-integration-blockers.md, B1).
      description: >
        Read-only: returns the organization's RoPA (`processingActivities`)
        entries declared as crossing borders (s.16), so a fiduciary's server
        integration can act on that register programmatically instead of a
        human reading it off the RoPA Builder dashboard. Archived activities
        are excluded. Write access to the RoPA stays dashboard-only
        (ADR-007 D3) —
        there is no corresponding write route.
      security:
        - apiKey: []
      responses:
        "200":
          description: >
            The calling key's organization's active, cross-border-flagged
            RoPA entries.
          content:
            application/json:
              schema:
                type: object
                required: [transfers]
                properties:
                  transfers:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          activityId,
                          activityName,
                          purpose,
                          dataCategories,
                          legalBasis,
                          createdAt,
                        ]
                      properties:
                        activityId:
                          type: string
                        activityName:
                          type: string
                        purpose:
                          type: string
                        dataCategories:
                          type: array
                          items:
                            type: string
                        legalBasis:
                          type: string
                          enum:
                            - consent
                            - deemed_consent
                            - legal_obligation
                            - vital_interest
                            - public_task
                        createdAt:
                          type: number
                          description: Epoch ms the RoPA entry was created.
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/discovery/manifest:
    post:
      operationId: ingestDiscoveryManifest
      summary: >
        Ingest a column manifest for a data discovery source
        (research/2026-09-06-dpdp-research.md, §5-P0).
      description: >
        The connector half of Data Discovery & Classification. Run a
        read-only `information_schema` (or equivalent) query against your own
        database replica, inside your own network, and POST the resulting
        column list here on whatever schedule you choose. The platform never
        holds your database credentials — nothing here is a connection
        string, and there is nothing for an attacker who breaches this
        platform to steal but a schema you can already see in the console.

        Each column is classified against the India-specific personal-data
        taxonomy (Aadhaar, PAN, IFSC, UPI VPA, Voter ID, ABHA, guardian
        indicators) and reconciled against what is already on file: a column
        already known is re-classified in place, keeping any review recorded
        against it, rather than duplicated. A nightly run keeps the source
        inside its 90-day re-scan horizon without anyone opening a browser.

        `sampleValues` is accepted only for a source whose owner has
        explicitly opted it in from the console. Values are matched against
        the patterns above and discarded inside the request; nothing stores
        them. Sending them for a source that has not opted in is a 400, not a
        silent drop.

        Listing a table in `reconcileTablePaths` asserts that this manifest
        describes it in full: any column on file under it and absent here is
        marked as dropped from your schema and stops counting toward your
        coverage gaps (it stays readable, because an evidence bundle may
        already attest to it). A table named there but carrying no column in
        `columns` is a 400 — otherwise one mis-pasted manifest would retire an
        entire inventory.

        Writes are narrow by design: this route can add to and reclassify one
        source's columns and retire columns in tables you reconcile. Creating
        or archiving a source, reviewing a field, and changing the
        sample-value opt-in all stay decisions someone makes in the console,
        signed in as themselves.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, columns]
              properties:
                sourceId:
                  type: string
                  description: >
                    The discovery source to ingest into, as shown in the
                    console. Must belong to the calling key's organization
                    and must not be archived.
                columns:
                  type: array
                  items:
                    type: object
                    required: [tablePath, columnName]
                    properties:
                      tablePath:
                        type: string
                        description: e.g. `public.customers`.
                      columnName:
                        type: string
                      declaredType:
                        type: string
                        description: The database's own type, e.g. `varchar`.
                      sampleValues:
                        type: array
                        maxItems: 20
                        items:
                          type: string
                        description: >
                          Opt-in only, and never stored. See the description
                          above before sending these.
                reconcileTablePaths:
                  type: array
                  items:
                    type: string
                  description: >
                    Tables this manifest describes in full. Columns on file
                    under them and absent here are retired.
      responses:
        "200":
          description: What the ingestion classified, added, updated and retired.
          content:
            application/json:
              schema:
                type: object
                required:
                  [fieldsClassified, fieldsNew, fieldsUpdated, fieldsRetired]
                properties:
                  fieldsClassified:
                    type: number
                  fieldsNew:
                    type: number
                  fieldsUpdated:
                    type: number
                  fieldsRetired:
                    type: number
        "400":
          description: >
            Malformed body, a manifest over the per-call column limit, sample
            values for a source that has not opted in, or a reconciled table
            the manifest does not describe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            No such source for the calling key's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The source is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/offline-consent/links:
    post:
      operationId: createOfflineConsentLink
      summary: >
        Generate an offline/QR consent link
        (docs/specs/offline-consent-capture.md, Problem Statement gap 6 —
        "no integration surface").
      description: >
        Creates the same `offlineConsentLinks` row the dashboard's "Offline
        consent link" generator does, so a fiduciary's server integration
        (HIS, POS terminal, CBS) can mint one without a human using the
        React admin page. The returned `token` resolves at
        `/offline-consent/{token}` on the fiduciary's own dpdpbot app
        origin — turn that URL into a QR code for a branch counter, agent
        desk, or POS terminal.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfflineConsentLinkRequest"
      responses:
        "201":
          description: Link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineConsentLink"
        "400":
          description: >
            Missing/invalid required fields, malformed JSON body, or the
            notice is not published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            Notice not found (or belongs to a different organization).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/offline/captures:
    post:
      operationId: syncOfflineCaptures
      summary: >
        Sync a batch of offline capture sessions
        (docs/specs/offline-consent-capture.md 4.4).
      description: >
        An enrolled field device — or the HIS/CBS/POS server fronting a fleet
        of them — pushes queued capture sessions here when connectivity
        returns. Each session carries an ECDSA P-256 signature produced in the
        device's secure element over the canonical string defined in
        `conformance/audit-hash-spec.md` (Cryptographic Consent Artifact); the
        server recomputes that string and verifies it against the enrolled
        `agentDevices` public key.


        Every session is processed independently, so **partial success is
        normal**: one forged or stale session never fails the others in the
        batch. `clientSessionId` is the idempotency key — replaying a batch
        that already committed returns the original per-session results and
        writes nothing. A session that fails verification is *quarantined*
        with a reason and retained as evidence, never silently dropped and
        never silently accepted.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessions]
              properties:
                sessions:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/OfflineCaptureSession"
      responses:
        "200":
          description: >
            Per-session results. A 200 does **not** mean every session was
            accepted — inspect each result's `status`.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/OfflineCaptureResult"
        "400":
          description: Malformed body, empty batch, or more than 200 sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/offline/pos:
    post:
      operationId: createPosConsentRequest
      summary: >
        Raise an asynchronous consent request from a POS terminal
        (docs/specs/offline-consent-capture.md 6.4).
      description: >
        Called by a till when a phone number is keyed in. Returns immediately
        with a token the receipt can render as a short link or QR code; the
        customer reviews the notice and confirms on their own device
        afterwards at `/consent/{token}`.


        **The response is not a consent.** No `consents` row exists until the
        principal affirmatively confirms — processing must not begin on the
        strength of a raised request. Unanswered requests expire after 72
        hours into the fiduciary's DPO queue. The submitted `phone` is HMAC'd
        per-organization before storage and is never persisted in the clear.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noticeId, purpose, dataTypes, phone]
              properties:
                noticeId:
                  type: string
                purpose:
                  type: string
                dataTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                phone:
                  type: string
                  description: >
                    Raw number as keyed in; normalised and hashed server-side.
                    Never stored in the clear.
      responses:
        "201":
          description: Pending request created.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, token, expiresAt]
                properties:
                  requestId:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: number
                    description: Epoch ms after which the request expires unanswered.
        "400":
          description: >
            Malformed body, unpublished notice, empty `dataTypes`, or a phone
            number containing no digits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            Notice not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/offline/ivr:
    post:
      operationId: recordIvrConsentArtifact
      summary: >
        Submit the artefact of a completed IVR consent call
        (docs/specs/offline-consent-capture.md 6.3).
      description: >
        dpdpbot defines this adapter contract but does not build telephony. A
        partner gateway posts what a completed call produced; the **audio
        recording is the affirmative-action evidence**, so
        `audioRecordingUri` is required — a DTMF digit alone proves a key was
        pressed, not that a notice was read out first.


        A `dtmfSequence` beginning with `1` is treated as acceptance and
        materialises an audited `consents` row with `source: offline_ivr`;
        anything else records the artefact without creating a consent, so a
        refusal is retained as evidence rather than discarded.
        `partnerSignature` is stored verbatim as an assertion of origin —
        dpdpbot cannot verify a key it does not hold and does not claim to.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IvrConsentArtifact"
      responses:
        "201":
          description: Artefact stored.
          content:
            application/json:
              schema:
                type: object
                required: [artifactId, accepted]
                properties:
                  artifactId:
                    type: string
                  consentId:
                    type: [string, "null"]
                  accepted:
                    type: boolean
        "400":
          description: >
            Malformed body, missing recording URI, unpublished notice, or a
            locale the notice has no content for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            Notice not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/offline/sms-withdraw:
    post:
      operationId: smsWhatsappWithdraw
      summary: >
        SMS/WhatsApp reply-keyword consent withdrawal
        (docs/specs/offline-consent-capture.md §5).
      description: >
        A fiduciary points their SMS/WhatsApp gateway's inbound webhook at
        this URL; every inbound reply is posted here, and only ones matching
        a withdrawal keyword (`stop`, `unsubscribe`, `withdraw`, `revoke`,
        `cancel`, matched case-insensitively against the whole trimmed
        message) act.


        Always returns `200` on a well-formed, authenticated request —
        including "no keyword matched" and "no receipt found for this
        number" — because the caller is a gateway relaying arbitrary inbound
        text, not a client that can act on a 4xx. `matched`/`withdrawn` in
        the response let an integration log the outcome without needing a
        status-code-as-enum.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, message]
              properties:
                phone:
                  type: string
                  description: >
                    Raw number as the gateway received it; normalised and
                    HMAC'd per-organization before lookup. Never stored in
                    the clear.
                message:
                  type: string
                  description: The inbound reply text, verbatim.
      responses:
        "200":
          description: Request processed (regardless of whether a keyword matched).
          content:
            application/json:
              schema:
                type: object
                required: [matched, withdrawn]
                properties:
                  matched:
                    type: boolean
                    description: Whether the message matched a withdrawal keyword.
                  withdrawn:
                    type: boolean
                    description: >
                      Whether at least one receipt for this phone number was
                      withdrawn as a result.
        "400":
          description: Malformed body, or the phone number contains no digits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-API-key rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
