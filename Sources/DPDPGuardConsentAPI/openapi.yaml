  /api/v1/observatory/observations:
    post:
      operationId: ingestObservatoryObservations
      summary: >
        Ingest a batch of Consent Observatory observations
        (docs/specs/consent-observatory-extension.md §7).
      description: >
        Unauthenticated by design — requiring an account would collapse
        contribution rates and would force linking a browsing-derived
        observation to an identity. Anti-abuse (quorum before publication,
        outlier rejection) happens downstream of ingest, not here; rate
        limiting is enforced at the edge, not by this route. Every
        observation is processed independently, so **partial success is
        normal**: one malformed observation never fails the batch. `domain`
        is re-normalized server-side (lowercased, scheme/port/userinfo
        stripped, reduced toward eTLD+1) — the client's own normalization is
        never trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch]
              properties:
                batch:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/ObservatoryObservation"
      responses:
        "202":
          description: >
            Per-observation results. A 202 does **not** mean every
            observation was accepted — inspect `rejected`.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted:
                    type: integer
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [index, reason]
                      properties:
                        index:
                          type: integer
                        reason:
                          type: string
        "400":
          description: Malformed body, missing `batch`, or an empty batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: More than 50 observations, or the body exceeds 256KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/observatory/domains/{domain}:
    get:
      operationId: getObservatoryDomainVerdict
      summary: >
        Read a domain's published Consent Observatory verdict
        (docs/specs/consent-observatory-extension.md §7).
      description: >
        Unauthenticated public read, so the browser extension (and any
        third party) can show a registry grade without shipping a Convex
        client. Returns only a verdict whose `publicationState` is
        `"published"` — every other state, and any domain with no verdict
        at all, is a `404`, never a redacted body, so an unpublished
        verdict's existence is not itself observable from outside. `domain`
        is re-normalized server-side (lowercased, scheme/path stripped,
        reduced toward eTLD+1) the same way ingest normalizes it.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
          description: The domain to look up, e.g. `example.com`.
      responses:
        "200":
          description: The domain's published verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservatoryDomainVerdict"
        "404":
          description: >
            No published verdict for this domain, or the `domain` path
            segment is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/observatory/sectors/{sector}:
    get:
      operationId: getObservatorySectorReport
      summary: >
        Download the aggregate-only sector report
        (docs/specs/consent-observatory-extension.md §12).
      description: >
        Unauthenticated public read of a CSV: cohort size, average score,
        and grade distribution for one closed-enum sector, aggregated only
        over `publicationState: "published"` verdicts on the current rubric
        version — never per-domain rows ("Open data (decided, OQ 8):
        aggregates only"). 404s for a `sector` outside the closed enum.
      parameters:
        - name: sector
          in: path
          required: true
          schema:
            type: string
            enum:
              [ecommerce, bfsi, healthtech, edtech, travel, media, gov_adjacent]
      responses:
        "200":
          description: >
            CSV with header `sector,cohortSize,averageScore,grade,count` —
            one row per grade in the sector's distribution.
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: "`sector` is not a recognized sector."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/observatory/contributions/{contributorHash}:
    delete:
      operationId: deleteObservatoryContributions
      summary: >
        "Delete my contributions" (docs/specs/consent-observatory-extension.md
        §18).
      description: >
        Unauthenticated, same reasoning as ingest — the only identity
        available is the rotating, salted `contributorHash` itself,
        never a user or organization id (§9.2). Deletes every
        `siteObservations` row for that hash. Always responds
        `{ "deleted": true }`, including for a hash with no observations —
        deletion is idempotent, and distinguishing "nothing to delete" from
        "deleted" would let a caller probe whether a given hash ever
        contributed anything. `contributorHash` rotates monthly with the
        salt (§9.2), so this only reaches what the current salt epoch can
        still link to one installation; after rotation, the data is no
        longer linkable to it. Ships ungated.
      parameters:
        - name: contributorHash
          in: path
          required: true
          schema:
            type: string
          description: The extension-local, salted contributor hash to erase.
      responses:
        "200":
          description: Every observation for this hash has been deleted (or there were none).
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "404":
          description: The `contributorHash` path segment is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      description: >
        A session token for a fiduciary/DPO staff login — distinct from
        `principalToken`, which authenticates a Data Principal via the
        brokered-token flow.
    apiKey:
      type: http
      scheme: bearer
      description: >
        A per-organization Consent Manager API key (`Authorization: Bearer
        <key>`). Only a hash of the key is ever stored server-side; the raw
        key is shown once, at creation time.
    principalToken:
      type: http
      scheme: bearer
      description: >
        A short-lived Data Principal access token minted by
        `POST /api/v1/auth/broker-token`. Never a service API key; no
        refresh token is issued in brokered mode. Holding this token proves
        the caller obtained it from the fiduciary's own backend (via its
        service API key) or from a direct dpdpbot login (OTP/password) — it
        is not an independent identity check by dpdpbot itself. See
        `docs/security/requester-identity-verification.md` for exactly what
        identity assurance backs a DSR/grievance/nomination request
        authenticated this way.
  parameters:
    ConsentId:
      name: consentId
      in: path
      required: true
      schema:
        type: string
      description: Convex document id of the `consents` row.
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      description: Convex document id of the `organizations` row.
    OrgSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      required:
        - code
        - error
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        error:
          type: string
          description: Human-readable message.
    OrgSummary:
      type: object
      required:
        - orgId
        - name
        - slug
      properties:
        orgId:
          type: string
        name:
          type: string
        slug:
          type: string
    Notice:
      type: object
      required:
        - _id
        - organizationId
        - version
        - itemized
        - content
        - status
      properties:
        _id:
          type: string
        organizationId:
          type: string
        version:
          type: integer
        itemized:
          type: array
          items:
            type: object
            required: [purpose, personalDataDescription]
            properties:
              purpose:
                type: string
              personalDataDescription:
                type: string
        content:
          type: object
          description: Map of language code to `{ title, body }`.
        status:
          type: string
          enum: [draft, published]
    DsrRequest:
      type: object
      required:
        - requestId
        - type
        - status
      properties:
        requestId:
          type: string
        type:
          type: string
          enum: [summary, processors, correction, erasure]
        status:
          type: string
          enum: [pending, in_progress, completed, rejected]
        dueAt:
          type: integer
          description: SLA deadline, Unix epoch milliseconds.
        requestDetails:
          type: string
    Grievance:
      type: object
      required:
        - grievanceId
        - subject
        - description
        - status
        - dueAt
      properties:
        grievanceId:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        dueAt:
          type: integer
          description: SLA deadline, Unix epoch milliseconds.
        respondedAt:
          type: integer
        response:
          type: string
    WidgetConfig:
      type: object
      required:
        - organizationId
        - noticeId
        - notice
      properties:
        organizationId:
          type: string
        noticeId:
          type: string
        notice:
          type: object
          required: [content, itemized]
          properties:
            content:
              type: object
              description: Map of language code to `{ title, body }`.
            itemized:
              type: array
              items:
                type: object
                required: [purpose, personalDataDescription]
                properties:
                  purpose:
                    type: string
                  personalDataDescription:
                    type: string
        bannerSettings:
          type: object
          description: Present only if the domain group has customized banner styling.
        portalUrl:
          type: [string, "null"]
          description: Absolute URL of the org's data-principal portal, or null.
        noticeVersion:
          type: integer
          description: >
            Version of the notice being presented; the widget stores it with
            the visitor's decision and re-prompts when it changes.
        noticeSourceLanguage:
          type: string
        grievanceContact:
          type: [object, "null"]
          description: The grievance contact the notice must name, or null.
          properties:
            name:
              type: string
            email:
              type: string
    ConsentGateDecision:
      type: object
      description: >
        One immutable row of the Consent Gate decision audit log, written by
        `POST /api/v1/consent/verify`.
      required:
        - decisionId
        - consentId
        - apiKeyId
        - decision
        - reason
        - decidedAt
      properties:
        decisionId:
          type: string
          description: >
            Stable id for this decision row — usable as a de-duplication key
            when tailing the log.
        consentId:
          type: string
          description: The consent record the decision was made about.
        apiKeyId:
          type: string
          description: >
            Which of the organization's own service API keys asked. Lets a
            fiduciary attribute a decision to one of its integrations.
        decision:
          type: string
          enum:
            - allow
            - deny
        reason:
          type: string
          enum:
            - consent_active
            - consent_withdrawn
        decidedAt:
          type: number
          description: Epoch ms the decision was made.
    ConsentGateBypassAlert:
      type: object
      description: >
        A consent denied repeatedly inside the rolling window — the "shall
        generate alerts" half of "any bypass attempt shall generate alerts
        and immutable audit records". Derived from `ConsentGateDecision`
        rows; nothing separate is stored.
      required:
        - consentId
        - denyCount
        - firstDeniedAt
        - lastDeniedAt
      properties:
        consentId:
          type: string
        denyCount:
          type: integer
          description: In-window denies against this consent.
        firstDeniedAt:
          type: number
          description: Epoch ms of the earliest in-window deny.
        lastDeniedAt:
          type: number
          description: Epoch ms of the most recent in-window deny.
    CmSignalRecord:
      type: object
      required:
        - "@context"
        - signalId
        - cmRegistryId
        - cmName
        - principalTokenFromCm
        - purposes
        - signalType
        - receivedAt
        - mappingStatus
      properties:
        "@context":
          type: string
          format: uri
        signalId:
          type: string
        cmRegistryId:
          type: string
        cmName:
          type: string
        principalTokenFromCm:
          type: string
        purposes:
          type: array
          items:
            type: string
        signalType:
          type: string
          enum: [consent_given, consent_withdrawn, consent_updated]
        receivedAt:
          type: integer
          description: Unix epoch milliseconds.
        mappingStatus:
          type: string
          enum: [mapped, unresolved, duplicate]
    Nomination:
      type: object
      required:
        - nominationId
        - nomineeName
        - nomineeContact
        - status
      properties:
        nominationId:
          type: string
        nomineeName:
          type: string
        nomineeContact:
          type: string
        status:
          type: string
          enum: [active, revoked]
    CreateOfflineConsentLinkRequest:
      type: object
      required:
        - noticeId
        - purpose
        - dataTypes
      properties:
        noticeId:
          type: string
          description: Convex document id of a *published* `notices` row.
        purpose:
          type: string
          minLength: 1
        dataTypes:
          type: array
          minItems: 1
          items:
            type: string
        label:
          type: string
          description: >
            Free-text identifier for where this link/QR code is deployed
            (e.g. "Mumbai Branch — Counter 3"). Shown back to staff only,
            never to the data principal.
    OfflineConsentLink:
      type: object
      required:
        - linkId
        - token
      properties:
        linkId:
          type: string
        token:
          type: string
          description: >
            Opaque token that resolves at `/offline-consent/{token}` on the
            fiduciary's own dpdpbot app origin.
    OfflineCaptureSession:
      type: object
      description: >
        One physical consent interaction, created on an enrolled device and
        replayed on sync (docs/specs/offline-consent-capture.md 2.2). Signed
        on-device; see `conformance/capture-artifact-vectors.json` for the
        canonicalisation an SDK must reproduce byte-for-byte.
      required:
        - clientSessionId
        - deviceId
        - noticeId
        - noticeVersion
        - noticeLocale
        - channel
        - capturedAtClient
        - deviceSignature
        - dataTypes
        - purposeGrants
      properties:
        clientSessionId:
          type: string
          description: >
            Client-generated UUIDv4 and the idempotency key. Re-syncing a
            session that already committed is a no-op.
        deviceId:
          type: string
          description: The enrolled `agentDevices` row whose key signed this.
        noticeId:
          type: string
        noticeVersion:
          type: number
          description: >
            Quarantined as `notice_superseded` if the notice has since moved
            on — a consent must not rest on text the principal never saw.
        noticeLocale:
          type: string
          description: >
            Eighth Schedule locale actually rendered. Inside the signature,
            because s. 5(3) evidence is about which language was read.
        channel:
          type: string
          enum: [qr, agent_app, pos, async_link, ivr]
        capturedAtClient:
          type: number
          description: >
            Device clock at capture. Recorded verbatim but never used for
            arithmetic; skew beyond 7 days quarantines as `clock_skew`.
        deviceSignature:
          type: string
          description: base64 of the raw IEEE-P1363 r||s ECDSA P-256 signature.
        dataTypes:
          type: array
          items:
            type: string
        purposeGrants:
          type: array
          description: >
            Every purpose the principal was *shown*, opted in or out.
            Declined purposes are submitted too: proving someone was shown
            marketing and refused is what distinguishes granular consent from
            a notice that quietly omitted it.
          items:
            type: object
            required: [purposeKey, purposeLabel, category, status]
            properties:
              purposeKey:
                type: string
              purposeLabel:
                type: string
              category:
                type: string
                enum: [essential, non_essential]
              status:
                type: string
                enum: [opt_in, opt_out]
        principalHandle:
          type: object
          description: >
            The identity handle the principal can later withdraw by. Signed
            raw; a `phone_hash` value is HMAC'd per-organization server-side
            and the raw number is never persisted.
          required: [kind, value]
          properties:
            kind:
              type: string
              enum: [phone_hash, uhid, cbs_ref, none]
            value:
              type: string
        linkId:
          type: string
          description: Set for QR-originated captures only.
    OfflineCaptureResult:
      type: object
      required: [clientSessionId, status]
      properties:
        clientSessionId:
          type: string
        status:
          type: string
          enum: [verified, quarantined, rejected]
        consentId:
          type: string
        reason:
          type: string
          description: >
            Present for a non-verified session — `unknown_device`,
            `device_revoked`, `signature_mismatch`, `clock_skew`,
            `notice_unpublished`, `notice_superseded`, or `invalid_session`.
        withdrawalToken:
          type: string
          description: >
            Present when a consent receipt was issued. Hand this to the
            principal (printed slip or read out) — it is what makes the
            consent withdrawable under s. 6(4).
    IvrConsentArtifact:
      type: object
      required:
        - noticeId
        - audioRecordingUri
        - locale
        - dtmfSequence
        - callerNumberHash
        - capturedAt
        - partnerSignature
        - purpose
        - dataTypes
        - partnerCallId
      properties:
        noticeId:
          type: string
        partnerCallId:
          type: string
          description: >
            The partner's identifier for the call, and the idempotency key for
            this submission. Gateways retry on timeout as a matter of course; a
            resubmission with the same `partnerCallId` returns the original
            artefact rather than materialising a second consent for one
            conversation.
        audioRecordingUri:
          type: string
          description: >
            Required. The recording is the affirmative-action evidence and is
            stored as an immutable artefact.
        transcript:
          type: string
        locale:
          type: string
          description: Rejected if the notice has no content for this locale.
        dtmfSequence:
          type: string
          description: A sequence beginning with `1` is acceptance; anything else is a refusal.
        callerNumberHash:
          type: string
          description: Hashed by the partner; dpdpbot never receives the number.
        capturedAt:
          type: number
        partnerSignature:
          type: string
          description: >
            Retained verbatim as an assertion of origin. dpdpbot does not hold
            the partner's key and does not claim to verify it.
        purpose:
          type: string
        dataTypes:
          type: array
          items:
            type: string
    RecordConsentRequest:
      type: object
      required:
        - email
        - noticeId
        - purpose
        - dataTypes
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Identifies the existing `userProfiles` row to consent on behalf of.
        noticeId:
          type: string
          description: Convex document id of a *published* `notices` row.
        purpose:
          type: string
          minLength: 1
        dataTypes:
          type: array
          minItems: 1
          items:
            type: string
    ConsentRecord:
      type: object
      required:
        - "@context"
        - consentId
        - purpose
        - dataTypes
        - givenAt
        - withdrawnAt
        - status
      properties:
        "@context":
          type: string
          format: uri
          description: JSON-LD context for this consent-record representation.
        consentId:
          type: string
        purpose:
          type: string
        dataTypes:
          type: array
          items:
            type: string
        givenAt:
          type: integer
          description: Unix epoch milliseconds.
        withdrawnAt:
          type:
            - integer
            - "null"
          description: Unix epoch milliseconds, or null while still active.
        status:
          type: string
          enum:
            - active
            - withdrawn
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: >
            Free-text message. Not yet a stable machine-readable code — see
            the "Known gap" note in the top-level description.
    ObservatoryObservation:
      type: object
      description: >
        One (domain, pageType, phase) snapshot
        (docs/specs/consent-observatory-extension.md §2.2, §4.1). Trimmed
        from the spec's full shape — no `pathHash`, `fpApiCalls`,
        `buttonGraph`, or `discoveredLinks` yet; this endpoint ships ingest
        and storage only, not rubric evaluation.
      required:
        - domain
        - pageType
        - phase
        - source
        - observedAt
        - rulesetVersion
      properties:
        domain:
          type: string
          description: >
            Re-normalized server-side on receipt — do not rely on this being
            echoed back verbatim.
        pageType:
          type: string
          enum:
            [
              home,
              listing,
              product,
              article,
              auth,
              checkout,
              account,
              form,
              policy,
              other,
            ]
        phase:
          type: string
          enum: [pre_interaction, post_accept, post_reject, no_action]
        source:
          type: string
          enum: [extension, probe, seed_crawl]
        observedAt:
          type: number
          description: Epoch milliseconds.
        rulesetVersion:
          type: string
        contributorHash:
          type: string
          description: >
            Rotating, salted hash of an extension-local install id. Absent
            for `source: probe`.
        cookies:
          type: array
          items:
            type: object
            required: [name, party, expiryClass]
            properties:
              name:
                type: string
              party:
                type: string
                enum: [first, third]
              expiryClass:
                type: string
                enum: [session, lt_24h, lt_30d, lt_13mo, gt_13mo]
        storageKeys:
          type: array
          items:
            type: string
        requestHosts:
          type: array
          items:
            type: string
        cmp:
          type: string
        bannerFingerprint:
          type: string
    ObservatoryDomainVerdict:
      type: object
      description: >
        A published Consent Observatory verdict
        (docs/specs/consent-observatory-extension.md §4.3, §7). Never
        includes `publicationState`, `noticeSentAt`,
        `claimedByOrganizationId`, or `sector` — those are internal-only
        fields on `siteVerdicts`; a `200` from this endpoint is only ever
        returned for a `"published"` row in the first place.
      required:
        - domain
        - rubricVersion
        - score
        - grade
        - checkResults
        - computedAt
        - staleAfter
      properties:
        domain:
          type: string
        rubricVersion:
          type: string
        score:
          type: number
          description: 0..100, excluding advisory checks.
        grade:
          type: string
          enum: [A, B, C, D, E, insufficient_data]
        checkResults:
          type: array
          items:
            type: object
            required: [checkKey, status, weight, confidence]
            properties:
              checkKey:
                type: string
              status:
                type: string
                enum: [pass, fail, insufficient_data]
              weight:
                type: number
              confidence:
                type: number
        computedAt:
          type: number
          description: Epoch milliseconds.
        staleAfter:
          type: number
          description: Epoch milliseconds; past this the verdict is due a recompute.
        reciprocalBadge:
          type:
            - object
            - "null"
          description: >
            Whether this domain itself runs dpdpbot's own consent banner
            (docs/specs/consent-observatory-extension.md §14, "Reciprocal
            loop"). Always populated, with `verified: false` when it does
            not; the type stays nullable for backward compatibility.
          properties:
            verified:
              type: boolean
            verifiedAt:
              type:
                - number
                - "null"
              description: >
                Epoch milliseconds of the most recent observation reporting
                dpdpbot's own CMP, or null when `verified` is false.
