name: Publish

# Swift Package Manager has no separate registry push - consumers resolve
# this package directly from git tags. "Publishing" a version means: prove
# it builds and tests clean at that tag, then cut a GitHub Release so
# consumers have real release notes to pin against.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Used as the GitHub Release tag/title when tag-push is unavailable (e.g. sandboxed environments that can't push tags)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          TAG="${TAG:-$GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
